name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# We run the open-source gitleaks program directly. The gitleaks-action wrapper
# needs a paid licence key for repositories owned by an organisation.
# The version is pinned and its checksum is verified before it is used.
# Keep GITLEAKS_VERSION in step with `rev` in .pre-commit-config.yaml.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so old commits are scanned too
      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the git history for secrets
        run: ./gitleaks git --redact --verbose --no-banner .
